method: probed
source: https://fibr.ai/robots.txt
notes: >-
  Fibr publishes machine-readable AI-consent directives in robots.txt on all three of
  its public hosts, using the Content Signals vocabulary. This is the only consent /
  AI-preference signal Fibr serves — there is no /.well-known/ document of any kind
  (see fibr-well-known.yml) and no security.txt. Note the two vocabularies are NOT the
  same string set and they disagree with each other: the marketing host declares
  `ai-training=disallow` while the AI knowledge-base and docs hosts declare
  `ai-train=yes`. Recorded verbatim rather than reconciled — the divergence is the
  finding.
hosts:
