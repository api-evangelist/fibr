      ai-training: disallow
      ai-search: allow
    named_ai_agents_allowed: [GPTBot, ClaudeBot, PerplexityBot, Google-Extended]
    sitemaps:
      - https://fibr.ai/sitemap.xml
      - https://ai.fibr.ai/sitemap-ai.xml
    note: >-
      Also carries an explicit AI-bot discovery comment block pointing at
      https://ai.fibr.ai/llms.txt and https://ai.fibr.ai/llms-full.txt.
  - host: https://ai.fibr.ai
