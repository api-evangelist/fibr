notes: >-
  Fibr publishes TWO dated release surfaces in its GitBook documentation: "Product
  Change Logs" (problem / impact / update writeups for platform changes) and "What's
  New" (feature announcements). Both are dated per entry and are available as
  machine-readable markdown by appending .md to the URL. There is no API changelog,
  because Fibr publishes no public API — these track the product UI and its
  integrations. No version numbers are attached to entries and no breaking-change
  notation is used; the scheme is continuous SaaS delivery, dated only.
